openapi: 3.0.3
info:
  title: Orders API
  version: 1.4.0
servers:
  - url: https://orders.acme.example
security:
  - bearer: []
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Accept an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: The order was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The request is not valid.
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Read one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order has this id.
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: The service is up.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
    CreateOrder:
      type: object
      required: [customerId, lines]
      properties:
        customerId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    Order:
      type: object
      required: [id, customerId, lines, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: number
        createdAt:
          type: string
          format: date-time
