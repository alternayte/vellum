apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          image: registry.acme.example/api:ghp_PLANTEDplanted0123456789
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: hunter2-planted
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
    apiKey: hunter2-planted
  ports:
    - port: 80
