# Deedbox event contracts. EventContracts.Verify writes this file; commit it.

stream decision (DecisionState)
  decision.decision_accepted v1 { at: date-time, by: string, contentHash: string?, stamps: [{ fingerprint: string?, ruleId: string, ruleVersion: int32, subjectId: uuid }] }
  decision.decision_changed v1 { at: date-time, by: string, content: { affectedIds: [uuid], alternatives: [{ title: string, whyNot: string? }], consequences: string?, context: string, decision: string, settles: [{ ruleId: string, subjectId: uuid }], supersedes: uuid?, title: string } }
  decision.decision_deleted v1 { at: date-time, by: string }
  decision.decision_proposed v1 { at: date-time, by: string, content: { affectedIds: [uuid], alternatives: [{ title: string, whyNot: string? }], consequences: string?, context: string, decision: string, settles: [{ ruleId: string, subjectId: uuid }], supersedes: uuid?, title: string }, number: int32, origin: string, projectId: uuid }
  decision.decision_rejected v1 { at: date-time, by: string, reason: string? }
  decision.settlement_recorded v1 { at: date-time, by: string, stamp: { fingerprint: string?, ruleId: string, ruleVersion: int32, subjectId: uuid } }
  decision.settlement_removed v1 { at: date-time, by: string, ruleId: string, subjectId: uuid }

stream model (ModelState)
  model.binding_added v1 { id: custom(BindingId), routingKey: string?, sourceChannelId: custom(ChannelId), targetChannelId: custom(ChannelId) }
  model.binding_changed v1 { bindingId: custom(BindingId), routingKey: string?, sourceChannelId: custom(ChannelId), targetChannelId: custom(ChannelId) }
  model.binding_provenance_recorded v1 { bindingId: custom(BindingId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4} }
  model.binding_removed v1 { bindingId: custom(BindingId) }
  model.branch_closed v1 { branchId: uuid }
  model.branch_forked v1 { bindings: [{ factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, id: custom(BindingId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, routingKey: string?, sourceChannelId: custom(ChannelId), stale: { reason: string, sinceRevision: string }?, targetChannelId: custom(ChannelId) }]?, channels: [{ factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, id: custom(ChannelId), kind: enum{Topic=0, Queue=1, Exchange=2}, name: string, provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }? }]?, elements: [{ description: string?, factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, icon: string?, id: custom(ElementId), kind: enum{Actor=0, System=1, App=2, Store=3, Component=4}, name: string, ownerId: uuid?, parentId: custom(ElementId)?, provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, sourceBindings: [{ externalKey: string, sourceId: uuid }]?, stale: { reason: string, sinceRevision: string }?, status: enum{Current=0, Planned=1, Deprecated=2, Removed=3}, tags: [string], technology: string? }], messages: [{ consumerIds: [custom(ElementId)], description: string?, factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, id: custom(MessageId), name: string, producerId: custom(ElementId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, schemaId: custom(SchemaId)?, stale: { reason: string, sinceRevision: string }?, tags: [string] }], operations: [{ factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, id: custom(OperationId), name: string, ownerId: custom(ElementId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, requestSchemaId: custom(SchemaId)?, responseSchemaId: custom(SchemaId)?, retry: { backoffMs: int32, maxAttempts: int32 }, stale: { reason: string, sinceRevision: string }?, timeoutMs: int32, transport: enum{Http=0, Grpc=1, Command=2} }]?, relationships: [{ factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, fromId: custom(ElementId), id: custom(RelationshipId), kind: enum{Structural=0, Behavioural=1}, label: string?, lineShape: string?, messageId: custom(MessageId)?, provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, technology: string?, toId: custom(ElementId) }], sourceStreamId: uuid, sourceVersion: int64, subscriptions: [{ channelId: custom(ChannelId), consumerId: custom(ElementId), deadLetterChannelId: custom(ChannelId)?, factStatus: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, id: custom(SubscriptionId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, retry: { backoffMs: int32, maxAttempts: int32 }, stale: { reason: string, sinceRevision: string }? }]? }
  model.channel_added v1 { id: custom(ChannelId), kind: enum{Topic=0, Queue=1, Exchange=2}, name: string }
  model.channel_changed v1 { channelId: custom(ChannelId), kind: enum{Topic=0, Queue=1, Exchange=2}, name: string }
  model.channel_provenance_recorded v1 { channelId: custom(ChannelId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4} }
  model.channel_removed v1 { channelId: custom(ChannelId) }
  model.element_added v1 { description: string?, id: custom(ElementId), kind: enum{Actor=0, System=1, App=2, Store=3, Component=4}, name: string, ownerId: uuid?, parentId: custom(ElementId)?, status: enum{Current=0, Planned=1, Deprecated=2, Removed=3}, tags: [string], technology: string? }
  model.element_description_changed v1 { description: string?, elementId: custom(ElementId) }
  model.element_icon_changed v1 { elementId: custom(ElementId), icon: string? }
  model.element_owner_changed v1 { elementId: custom(ElementId), ownerId: uuid? }
  model.element_provenance_recorded v1 { elementId: custom(ElementId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4} }
  model.element_removed v1 { elementId: custom(ElementId) }
  model.element_renamed v1 { elementId: custom(ElementId), name: string }
  model.element_reparented v1 { elementId: custom(ElementId), parentId: custom(ElementId)? }
  model.element_retagged v1 { elementId: custom(ElementId), tags: [string] }
  model.element_source_bound v1 { elementId: custom(ElementId), externalKey: string, sourceId: uuid }
  model.element_status_changed v1 { elementId: custom(ElementId), status: enum{Current=0, Planned=1, Deprecated=2, Removed=3} }
  model.element_technology_changed v1 { elementId: custom(ElementId), technology: string? }
  model.message_added v1 { consumerIds: [custom(ElementId)], description: string?, id: custom(MessageId), name: string, producerId: custom(ElementId), schemaId: custom(SchemaId)?, tags: [string] }
  model.message_provenance_recorded v1 { messageId: custom(MessageId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4} }
  model.message_removed v1 { messageId: custom(MessageId) }
  model.message_updated v1 { consumerIds: [custom(ElementId)]?, description: string?, messageId: custom(MessageId), name: string?, producerId: custom(ElementId)?, schemaId: custom(SchemaId)?, setSchemaId: bool, tags: [string]? }
  model.operation_added v1 { id: custom(OperationId), name: string, ownerId: custom(ElementId), requestSchemaId: custom(SchemaId)?, responseSchemaId: custom(SchemaId)?, retry: { backoffMs: int32, maxAttempts: int32 }, timeoutMs: int32, transport: enum{Http=0, Grpc=1, Command=2} }
  model.operation_changed v1 { name: string, operationId: custom(OperationId), ownerId: custom(ElementId), requestSchemaId: custom(SchemaId)?, responseSchemaId: custom(SchemaId)?, retry: { backoffMs: int32, maxAttempts: int32 }, timeoutMs: int32, transport: enum{Http=0, Grpc=1, Command=2} }
  model.operation_provenance_recorded v1 { operationId: custom(OperationId), provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4} }
  model.operation_removed v1 { operationId: custom(OperationId) }
  model.relationship_added v1 { fromId: custom(ElementId), id: custom(RelationshipId), kind: enum{Structural=0, Behavioural=1}, label: string?, messageId: custom(MessageId)?, technology: string?, toId: custom(ElementId) }
  model.relationship_kind_changed v1 { kind: enum{Structural=0, Behavioural=1}, relationshipId: custom(RelationshipId) }
  model.relationship_label_changed v1 { label: string?, relationshipId: custom(RelationshipId) }
  model.relationship_line_shape_changed v1 { lineShape: string?, relationshipId: custom(RelationshipId) }
  model.relationship_provenance_recorded v1 { provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, relationshipId: custom(RelationshipId), stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4} }
  model.relationship_removed v1 { relationshipId: custom(RelationshipId) }
  model.relationship_technology_changed v1 { relationshipId: custom(RelationshipId), technology: string? }
  model.subscription_added v1 { channelId: custom(ChannelId), consumerId: custom(ElementId), deadLetterChannelId: custom(ChannelId)?, id: custom(SubscriptionId), retry: { backoffMs: int32, maxAttempts: int32 } }
  model.subscription_changed v1 { channelId: custom(ChannelId), consumerId: custom(ElementId), deadLetterChannelId: custom(ChannelId)?, retry: { backoffMs: int32, maxAttempts: int32 }, subscriptionId: custom(SubscriptionId) }
  model.subscription_provenance_recorded v1 { provenance: { acceptedAt: date-time?, acceptedAtVersion: int64?, acceptedBy: uuid?, acceptedOnBranch: uuid?, confidence: float64?, revision: string?, source: string? }?, stale: { reason: string, sinceRevision: string }?, status: enum{Declared=0, ObservedInSource=1, Inferred=2, Measured=3, Unknown=4}, subscriptionId: custom(SubscriptionId) }
  model.subscription_removed v1 { subscriptionId: custom(SubscriptionId) }

stream promise (PromiseState)
  promise.obligation_added v1 { actor: string?, at: date-time, by: string, obligation: { generatorKey: string?, id: string, kind: string, number: int32, recipe: { plan: { contractIds: [uuid], evidenceSource: { job: string?, repository: string, system: string, workflow: string }?, expectedObservations: [string], forbiddenObservations: [string], inputs: [string], steps: [string] }?, scenarioCheck: { expect: [{ id: string }], faults: [{ failFirst: int32?, kind: enum{Error=0, Timeout=1, Outage=2}, target: uuid }], scenarioId: uuid }?, sourcePattern: { pattern: string, repository: string, requireUnconditional: bool?, service: uuid? }?, text: string }, source: string, title: string }, revision: int32 }
  promise.obligation_changed v1 { actor: string?, at: date-time, by: string, obligation: { generatorKey: string?, id: string, kind: string, number: int32, recipe: { plan: { contractIds: [uuid], evidenceSource: { job: string?, repository: string, system: string, workflow: string }?, expectedObservations: [string], forbiddenObservations: [string], inputs: [string], steps: [string] }?, scenarioCheck: { expect: [{ id: string }], faults: [{ failFirst: int32?, kind: enum{Error=0, Timeout=1, Outage=2}, target: uuid }], scenarioId: uuid }?, sourcePattern: { pattern: string, repository: string, requireUnconditional: bool?, service: uuid? }?, text: string }, source: string, title: string }, revision: int32 }
  promise.obligation_removed v1 { actor: string?, at: date-time, by: string, obligationId: string, revision: int32 }
  promise.promise_approved v1 { approvedBy: string, at: date-time, contentHash: string?, links: map<string>, modelVersion: int64, revision: int32 }
  promise.promise_created v1 { actor: string?, at: date-time, content: { claim: string, evidenceCriteria: string?, expectedOutcome: string?, forbiddenEvents: [{ kind: enum{RequestSent=0, ResponseReceived=1, RequestFailed=2, RequestTimedOut=3, RetryScheduled=4, Published=5, PublishFailed=6, Delivered=7, DeliveryFailed=8, DeadLettered=9, Dropped=10, DataWritten=11, DataWriteFailed=12, BranchTaken=13, StepSkipped=14, Routed=15, NotRouted=16}, target: uuid? }], forbiddenOutcome: string?, links: { channelIds: [uuid], elementIds: [uuid], messageIds: [uuid], operationIds: [uuid], scenarioIds: [uuid], subscriptionIds: [uuid] }, preconditions: string?, requiresPattern: { pattern: string, repository: string, service: uuid? }?, scope: string?, title: string }, createdBy: string, number: int32, origin: string, projectId: uuid, requirementId: string }
  promise.promise_deleted v1 { actor: string?, at: date-time, by: string }
  promise.promise_draft_changed v1 { actor: string?, at: date-time, by: string, content: { claim: string, evidenceCriteria: string?, expectedOutcome: string?, forbiddenEvents: [{ kind: enum{RequestSent=0, ResponseReceived=1, RequestFailed=2, RequestTimedOut=3, RetryScheduled=4, Published=5, PublishFailed=6, Delivered=7, DeliveryFailed=8, DeadLettered=9, Dropped=10, DataWritten=11, DataWriteFailed=12, BranchTaken=13, StepSkipped=14, Routed=15, NotRouted=16}, target: uuid? }], forbiddenOutcome: string?, links: { channelIds: [uuid], elementIds: [uuid], messageIds: [uuid], operationIds: [uuid], scenarioIds: [uuid], subscriptionIds: [uuid] }, preconditions: string?, requiresPattern: { pattern: string, repository: string, service: uuid? }?, scope: string?, title: string }, revision: int32 }
  promise.promise_revised v1 { actor: string?, at: date-time, by: string, retires: bool, revision: int32 }
  promise.verification_run_recorded v1 { run: { actor: string?, assertions: [{ detail: string, id: string, passed: bool, vacuous: bool, vacuousReason: string? }]?, at: date-time, commitSha: string?, detail: string, draft: bool?, effectiveFaults: [{ failFirst: int32?, kind: enum{Error=0, Timeout=1, Outage=2}, target: uuid }]?, environment: string, evidence: [{ artifactDigest: string?, claimedResult: string?, hash: string?, identity: string?, identityReason: string?, kind: string, pointer: string?, scenarioId: uuid?, source: { commitSha: string, conclusion: string, jobName: string?, repository: string?, runId: int64?, runUrl: string, system: string, workflow: string? }?, url: string? }], id: uuid, inputs: { commitSha: string?, coverage: string?, modelStreamId: uuid?, modelVersion: int64?, obligationHash: string, ref: string?, repository: string?, scanId: uuid?, scanKind: string?, scenarioHash: string?, scenarioId: uuid?, scenarioVersion: int64?, schemas: [{ id: uuid, version: int32 }]? }?, limitations: [string], modelRevision: { revisionId: uuid?, revisionName: string?, streamId: uuid, version: int64 }?, obligationHash: string, obligationId: string, promiseRevision: int32, result: string, scanId: uuid?, scope: string, startedBy: string } }

stream scenario (ScenarioState)
  scenario.scenario_deleted v1 { scenarioId: custom(ScenarioId) }
  scenario.scenario_saved v1 { document: { assertions: [{ id: string }], faults: [{ failFirst: int32?, kind: enum{Error=0, Timeout=1, Outage=2}, target: uuid }], id: custom(ScenarioId), name: string, steps: [{ id: string }] }, name: string, origin: { kind: string, model: string, proposalId: uuid, provider: string }?, projectId: uuid }

stream schema (SchemaState)
  schema.schema_created v1 { content: string, description: string?, id: uuid, name: string, projectId: uuid, version: int32 }
  schema.schema_deleted v1 { schemaId: uuid }
  schema.schema_updated v1 { content: string?, description: string?, name: string?, schemaId: uuid, version: int32? }
