# Builds the container image on a version tag and checks that a clean Docker Compose
# deployment starts and reports healthy. It pushes nothing: no registry is decided yet.
# To publish, add a registry login and a push of the built image after the checks.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker compose build vellum

      # The self-host quickstart: one command, no configuration. `--wait` fails the step
      # when the health check of the app does not report healthy.
      - name: Start a clean Compose deployment
        run: docker compose up -d --wait

      - name: The app answers and asks for first-run setup
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = 200
          curl -sS --fail-with-body http://127.0.0.1:8080/api/setup/status | tee status.json
          test "$(jq -r .needsSetup status.json)" = true
          docker compose logs vellum | grep -q "VELLUM SETUP CODE"

      - name: Show the log
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
