# Fast CI (Vellum-SDD.md §9): build, format, type checks and tests for correctness, security
# and data boundaries. No browser, no screenshots, no paid AI key and no live GitHub access.
# The five live smoke tests skip, because no VELLUM_LIVE_* value is set.
# Backend tests marked Category=Slow run in their own job: on a manual run, on a v* tag and
# every night. A push and a pull request run the other backend tests.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  # Code style and the OpenAPI check run in their own job, beside the tests.
  backend-style:
    name: Backend style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Vellum.slnx

      - name: Build
        run: dotnet build Vellum.slnx --no-restore

      # The build of the API writes its OpenAPI document. The web client and the HTTP API
      # reference of the docs are generated from the committed copy, so the two must be equal.
      - name: The committed OpenAPI document is current
        run: diff -u src/Vellum.Web/openapi.json src/Vellum/obj/Vellum.json

      # Code style and whitespace (.editorconfig).
      - name: Code style
        run: |
          dotnet format style Vellum.slnx --verify-no-changes --no-restore
          dotnet format whitespace Vellum.slnx --verify-no-changes

  # The tests without Category=Slow, in shards that run at the same time. tests/test-shard.py
  # gives each test class to one shard, so the shards cover every test once.
  backend:
    name: Backend (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The k6 script tests run each generated script through the real k6. With CI set and
      # no k6 they fail, so that "the k6 script is valid" (SDD §10) holds in CI.
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.1.0"

      - name: Restore
        run: dotnet restore Vellum.slnx

      - name: Build
        run: dotnet build Vellum.slnx --no-restore

      - name: Select the tests of this shard
        run: |
          dotnet test tests/Vellum.Tests --no-build --list-tests > tests.txt
          filter=$(python3 tests/test-shard.py 6 $(( ${{ matrix.shard }} - 1 )) < tests.txt)
          echo "FILTER=$filter" >> "$GITHUB_ENV"

      # The integration tests start Postgres with Testcontainers. Docker is on the runner.
      # Test classes run in parallel, each on its own copy of a template database. The step
      # time-out is about twice the time a shard takes: a slower suite fails here.
      - name: Test
        timeout-minutes: 4
        run: dotnet test tests/Vellum.Tests --no-build --filter "$FILTER" --logger "trx;LogFileName=backend-${{ matrix.shard }}.trx" --results-directory test-results

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: test-results

  backend-slow:
    name: Backend (slow tests)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.1.0"

      - name: Restore
        run: dotnet restore Vellum.slnx

      - name: Build
        run: dotnet build Vellum.slnx --no-restore

      # Tests that take long by design: a statistical bound over 200 long runs, a lock-cycle
      # hunt under load, a 20,000-fact plan and a real k6 run.
      - name: Test
        run: dotnet test Vellum.slnx --no-build --filter "Category=Slow" --logger "trx;LogFileName=backend-slow.trx" --results-directory test-results

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-slow-test-results
          path: test-results

  web:
    name: Web client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Vellum.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/Vellum.Web/package-lock.json

      - name: Install
        run: npm ci

      # The API client is generated from the committed openapi.json and is not in the repository.
      - name: Generate the API client
        run: npm run generate

      # The Vite build writes the route tree (src/routeTree.gen.ts), which is not in the
      # repository. The lint and the type check read it, so the build runs first.
      - name: Build
        run: npx vite build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      # The build writes the HTTP API reference from src/Vellum.Web/openapi.json and fails
      # on an internal link or a heading anchor that does not resolve.
      - name: Build and check the links
        run: npm run build

      # Every /api/ path that a page names is in openapi.json. Every sh block parses, every
      # json block is valid, and the blocks marked "run" run. The blocks marked "live" need
      # a running Vellum: site/scripts/verify-live.sh runs them, and it is not part of CI.
      - name: Check the paths and the snippets
        run: npm run check
